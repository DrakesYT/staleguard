<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" width="820" height="600" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">StaleGuard system architecture</title>
  <desc id="d">Three entry points (answer check, meeting brief, bookmarklet) call a FastAPI pipeline: extract claims, gather dated evidence with Tavily, label stance with a cheap model, score freshness in code, refresh the answer with a smart model. Every model call goes through the Bifrost gateway with a budgeted virtual key, retries and a fallback chain across Gemini and Groq models.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8a877f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .box { fill: #fcfcfb; stroke: #cfcdc6; stroke-width: 1; }
      .h { font-size: 14px; font-weight: 600; fill: #1b1f24; }
      .s { font-size: 11.5px; fill: #5b6470; }
      .ln { stroke: #8a877f; stroke-width: 1.5; fill: none; }
      .lbl { font-size: 11px; fill: #8a877f; }
    </style>
  </defs>
  <rect x="0" y="0" width="820" height="600" rx="14" fill="#ffffff"/>

  <!-- entry points -->
  <rect class="box" x="40" y="22" width="240" height="62" rx="9"/>
  <text class="h" x="160" y="46" text-anchor="middle">Check an AI answer</text>
  <text class="s" x="160" y="66" text-anchor="middle">verdicts stream in · inline highlights</text>
  <rect class="box" x="300" y="22" width="220" height="62" rx="9"/>
  <text class="h" x="410" y="46" text-anchor="middle">Meeting brief</text>
  <text class="s" x="410" y="66" text-anchor="middle">last 30 days · auto re-check pre-meeting</text>
  <rect class="box" x="540" y="22" width="240" height="62" rx="9"/>
  <text class="h" x="660" y="46" text-anchor="middle">Bookmarklet</text>
  <text class="s" x="660" y="66" text-anchor="middle">select text on any page → check it</text>

  <line class="ln" x1="160" y1="84" x2="160" y2="120" marker-end="url(#a)"/>
  <line class="ln" x1="410" y1="84" x2="410" y2="120" marker-end="url(#a)"/>
  <line class="ln" x1="660" y1="84" x2="660" y2="120" marker-end="url(#a)"/>
  <text class="lbl" x="172" y="107">SSE stream / JSON API</text>

  <!-- pipeline -->
  <rect x="30" y="124" width="760" height="214" rx="16" fill="#eeedfe" stroke="#534ab7" stroke-width="1"/>
  <text x="410" y="148" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3c3489">FastAPI pipeline</text>
  <text x="410" y="166" text-anchor="middle" font-size="11.5" fill="#534ab7">the LLM labels evidence · code computes the score</text>

  <rect class="box" x="46" y="182" width="136" height="62" rx="9"/>
  <text class="h" x="114" y="206" text-anchor="middle">Extract claims</text>
  <text class="s" x="114" y="226" text-anchor="middle">cheap model + quotes</text>
  <rect class="box" x="194" y="182" width="136" height="62" rx="9"/>
  <text class="h" x="262" y="206" text-anchor="middle">Gather evidence</text>
  <text class="s" x="262" y="226" text-anchor="middle">Tavily · dated sources</text>
  <rect class="box" x="342" y="182" width="136" height="62" rx="9"/>
  <text class="h" x="410" y="206" text-anchor="middle">Label stance</text>
  <text class="s" x="410" y="226" text-anchor="middle">cheap model</text>
  <rect x="490" y="182" width="136" height="62" rx="9" fill="#fff8e6" stroke="#c9952e" stroke-width="1"/>
  <text class="h" x="558" y="206" text-anchor="middle">Score freshness</text>
  <text class="s" x="558" y="226" text-anchor="middle">pure code, tested</text>
  <rect class="box" x="638" y="182" width="136" height="62" rx="9"/>
  <text class="h" x="706" y="206" text-anchor="middle">Refresh answer</text>
  <text class="s" x="706" y="226" text-anchor="middle">smart model</text>
  <line class="ln" x1="182" y1="213" x2="192" y2="213" marker-end="url(#a)"/>
  <line class="ln" x1="330" y1="213" x2="340" y2="213" marker-end="url(#a)"/>
  <line class="ln" x1="478" y1="213" x2="488" y2="213" marker-end="url(#a)"/>
  <line class="ln" x1="626" y1="213" x2="636" y2="213" marker-end="url(#a)"/>

  <text class="s" x="410" y="272" text-anchor="middle">score = recency (half-life per category) × source authority (official &gt; docs &gt; news &gt; user-generated)</text>
  <text class="s" x="410" y="292" text-anchor="middle">+ agreement across domains − contradiction share → current · aging · disputed · outdated</text>
  <text class="s" x="410" y="318" text-anchor="middle">brief writer (smart model) · pre-meeting re-check loop · SQLite store · eval harness (27 labelled claims)</text>

  <line class="ln" x1="255" y1="338" x2="255" y2="374" marker-end="url(#a)"/>
  <line class="ln" x1="635" y1="338" x2="635" y2="374" marker-end="url(#a)"/>
  <text class="lbl" x="267" y="361">every LLM call, x-bf-vk</text>
  <text class="lbl" x="647" y="361">every search</text>

  <!-- gateways -->
  <rect x="40" y="378" width="430" height="96" rx="9" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
  <text x="255" y="401" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Bifrost gateway</text>
  <text x="255" y="421" text-anchor="middle" font-size="11.5" fill="#0f6e56">virtual key staleguard-app · $1/day budget · 600 req/h</text>
  <text x="255" y="439" text-anchor="middle" font-size="11.5" fill="#0f6e56">429 → retry with backoff → fallback chain</text>
  <text x="255" y="457" text-anchor="middle" font-size="11.5" fill="#0f6e56">routing_info per call → routing log + cost in the UI</text>

  <rect x="490" y="378" width="290" height="96" rx="9" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
  <text x="635" y="401" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Tavily</text>
  <text x="635" y="421" text-anchor="middle" font-size="11.5" fill="#0f6e56">general search: what is true now</text>
  <text x="635" y="439" text-anchor="middle" font-size="11.5" fill="#0f6e56">news search: "value changed" coverage</text>
  <text x="635" y="457" text-anchor="middle" font-size="11.5" fill="#0f6e56">published dates feed the score</text>

  <path class="ln" d="M255 474 V490 H90 V508" marker-end="url(#a)"/>
  <path class="ln" d="M255 474 V490 H200 V508" marker-end="url(#a)"/>
  <path class="ln" d="M255 474 V490 H310 V508" marker-end="url(#a)"/>
  <path class="ln" d="M255 474 V490 H420 V508" marker-end="url(#a)"/>

  <!-- models: cheap primary, smart primary, then extra quota pools -->
  <rect class="box" x="40" y="512" width="100" height="54" rx="8"/>
  <text x="90" y="535" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b1f24">Gemini</text>
  <text class="s" x="90" y="552" text-anchor="middle">3.5 Flash-Lite</text>
  <rect class="box" x="150" y="512" width="100" height="54" rx="8"/>
  <text x="200" y="535" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b1f24">Groq</text>
  <text class="s" x="200" y="552" text-anchor="middle">gpt-oss-120b</text>
  <rect class="box" x="260" y="512" width="100" height="54" rx="8"/>
  <text x="310" y="535" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b1f24">Groq</text>
  <text class="s" x="310" y="552" text-anchor="middle">gpt-oss-20b</text>
  <rect class="box" x="370" y="512" width="100" height="54" rx="8"/>
  <text x="420" y="535" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b1f24">Groq</text>
  <text class="s" x="420" y="552" text-anchor="middle">Qwen3.8 27B</text>
  <text class="lbl" x="90" y="582" text-anchor="middle">cheap model</text>
  <text class="lbl" x="200" y="582" text-anchor="middle">smart model</text>
  <text class="lbl" x="365" y="582" text-anchor="middle">extra fallbacks</text>

  <text class="s" x="635" y="535" text-anchor="middle">each model has its own free-tier quota,</text>
  <text class="s" x="635" y="552" text-anchor="middle">so the fallback chain also adds capacity</text>
</svg>
